name: Release and Publish

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing (OIDC) needs npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -f dist/mcp/index.js ]; then
            echo "dist/mcp/index.js missing after build"
            ls -la
            exit 1
          fi
          echo "Files in dist: $(find dist -type f | wc -l)"
          find dist -type f | head -20

      - name: Determine version bump
        id: version-type
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          echo "Latest commit: $COMMIT_MSG"

          HAS_BREAKING=false
          if echo "$COMMIT_BODY" | grep -iE "^BREAKING CHANGE:" > /dev/null; then
            HAS_BREAKING=true
          fi

          if echo "$COMMIT_MSG" | grep -iE "^feat(\(.+\))?!?:" > /dev/null; then
            if echo "$COMMIT_MSG" | grep -E "^feat(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
            else
              echo "version_type=minor" >> $GITHUB_OUTPUT
            fi
          elif echo "$COMMIT_MSG" | grep -iE "^fix(\(.+\))?!?:" > /dev/null; then
            if echo "$COMMIT_MSG" | grep -E "^fix(\(.+\))?!:" > /dev/null || [ "$HAS_BREAKING" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
            fi
          else
            if [ "$HAS_BREAKING" = true ]; then
              echo "version_type=major" >> $GITHUB_OUTPUT
            else
              echo "version_type=patch" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Skip release for version bump commits
        id: guard
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          if echo "$COMMIT_MSG" | grep -qE "^chore\(release\): "; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release commit detected, nothing to do"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version-bump
        if: steps.guard.outputs.skip == 'false'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current: $CURRENT"

          NEW=$(npm version ${{ steps.version-type.outputs.version_type }} --no-git-tag-version)
          NEW=$(echo $NEW | sed 's/^v//')
          echo "New: $NEW"
          echo "new_version=$NEW" >> $GITHUB_OUTPUT

      # Publish before tagging: a failed publish must not leave an orphan tag or release.
      - name: Publish to NPM
        if: steps.guard.outputs.skip == 'false'
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION="${{ steps.version-bump.outputs.new_version }}"

          echo "Checking if $PACKAGE@$VERSION exists..."
          if npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already published, skipping"
            exit 0
          fi

          echo "Publishing $PACKAGE@$VERSION via trusted publishing (OIDC)..."
          npm publish --access public
          echo "Published $PACKAGE@$VERSION"

      - name: Commit, tag, and push
        if: steps.guard.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version-bump.outputs.new_version }}"

          git add package.json package-lock.json
          git commit -m "chore(release): ${VERSION}"

          git fetch origin release
          if [ "$(git rev-list --count HEAD..origin/release)" -gt 0 ]; then
            echo "Behind remote, rebasing..."
            git rebase origin/release
          fi
          git push origin HEAD:release

          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-bump.outputs.new_version }}
          name: Release v${{ steps.version-bump.outputs.new_version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
